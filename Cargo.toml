[workspace]
members = [
    "libs/*"
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[profile.release]
lto = true

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.92"
log = "0.4"
solana-compute-budget-interface = "3"
solana-hash = "4.4"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = { version = "~4.6.0", features = ["wincode"] }
solana-packet = "4.2"
solana-pubkey = "4.2"
solana-signature = "3.4"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = { version = "~4.3.0", features = ["wincode"] }
solana-transaction-builder = { path = "./libs/solana-transaction-builder" }
solana-transaction-error = "4.1"
solana-transaction-executor = { git = "https://github.com/marinade-finance/solana-transaction-executor", branch = "solana-to-4.x" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
wincode = "0.6.1"
