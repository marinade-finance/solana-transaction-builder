[workspace]
members = [
    "libs/*"
]
resolver = "2"

[profile.release]
lto = true

[workspace.dependencies]
anyhow = "1.0.82"
async-stream = "0.3.5"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = { version = "1.5", features = ["derive"] }
cached = "0.44.0"
futures = "0.3.29"
log = "0.4.21"
once_cell = "1.19.0"
solana-client = "3.1.14"
solana-commitment-config = "3"
solana-hash = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-packet = "3"
solana-pubkey = { version = "3", features = ["borsh"] }
solana-signature = "3"
solana-signer = "3"
solana-transaction = "3"
solana-transaction-builder = { path =  "./libs/solana-transaction-builder"}
solana-transaction-executor = { git = "https://github.com/marinade-finance/solana-transaction-executor", tag = "solana-3.0.x" }
thiserror = "1.0.58"
tokio = { version = "1.34.0", features = ["full"] }
uuid = { version = "1.4.1", features = ["v4"] }
